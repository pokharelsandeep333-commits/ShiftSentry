# ============================================================
# 🚀 ShiftSaaS — Production CI/CD Pipeline
# ============================================================
# GATES:
#   1. Secrets  → Gitleaks scans the full Git history
#   2. Quality  → Prisma, tests, types, lint, production build
#   3. DB rules → Migrations + trigger/policy/grant suites on real Postgres
#   4. Audit    → Blocks all high/critical production findings
#   5. Image    → Docker build verification
#   6. CodeQL   → JavaScript and TypeScript security analysis
#   7. Release  → Verified image, Trivy scan before push, migration,
#                 immutable promotion
# ============================================================

name: "🚀 ShiftSaaS CI/CD Pipeline"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ================================================================
  # JOB 1: SECRET SCANNING — Full Git history with Gitleaks
  # ================================================================
  gitleaks:
    name: "🔐 Secret scanning"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check out repository history"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "🔐 Scan for leaked secrets"
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ================================================================
  # JOB 2: APPLICATION QUALITY — Build the actual production app
  # ================================================================
  quality:
    name: "✅ Application quality"
    needs: gitleaks
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: "📥 Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "📦 Set up Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1
        with:
          node-version: 24
          cache: npm
      - name: "📦 Install dependencies"
        run: npm ci
      - name: "🗃️ Generate Prisma client"
        run: npm run db:generate
      - name: "🗃️ Validate Prisma schema"
        run: npx prisma validate
      - name: "🧪 Run unit tests"
        run: npm run test:earnings && npm run test:auth && npm run test:game && npm run test:security
      - name: "📜 Verify immutable legal snapshot"
        run: npm run check:legal
      - name: "🔎 Type-check"
        run: npx tsc --noEmit
      - name: "🔍 Lint"
        run: npm run lint
      - name: "🏗️ Build production app"
        run: npm run build

  # ================================================================
  # JOB 3: DEPENDENCY AUDIT — Block all high/critical production findings
  # ================================================================
  audit-production:
    name: "📦 Production dependency audit"
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "📦 Set up Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.1
        with:
          node-version: 24
          cache: npm
      - name: "📦 Install dependencies"
        run: npm ci
      - name: "🔍 Audit production dependencies"
        run: npm run audit:production

  # ================================================================
  # JOB 3b: DATABASE RULES — Migrations applied to a real Postgres
  # ================================================================
  # The earnings snapshot, the weekly caps and every imposter-game secrecy rule
  # live in triggers, policies and grants. The quality job cannot see any of
  # them: it type-checks and runs the TypeScript suites, which never touch a
  # database. This applies every migration to an empty Postgres the way the
  # release job applies them to production, then plays against the result as the
  # `authenticated` role.
  #
  # No setup-node and no npm ci -- the script only needs Docker, which the runner
  # already has, so this job starts in seconds.
  sql-tests:
    name: "🗄️ Database rule tests"
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🗄️ Apply migrations and run database suites"
        run: bash scripts/run-sql-tests.sh

  # ================================================================
  # JOB 4: IMAGE CHECK — Prove the production Dockerfile builds
  # ================================================================
  docker-build:
    name: "🐳 Docker build verification"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exercise the release-only installer before it can reach production.
      - name: "🗃️ Verify Supabase CLI setup"
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.84.2
      - name: "🗃️ Check pinned release CLI version"
        run: test "$(supabase --version)" = "2.84.2"
      - name: "🐳 Build image with non-secret placeholders"
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          --build-arg GIT_SHA=${{ github.sha }}
          --tag shiftsentry:ci .

  # ================================================================
  # JOB 5: DEPENDENCY REVIEW — Pull-request dependency changes
  # ================================================================
  dependency-review:
    name: "📋 Dependency review"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: "📋 Review dependency changes"
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # ================================================================
  # JOB 6: CODEQL — Security analysis for JavaScript and TypeScript
  # ================================================================
  codeql:
    name: "🛡️ CodeQL"
    needs: gitleaks
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🛡️ Initialize CodeQL"
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: "🛡️ Analyze code"
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  # ================================================================
  # JOB 7: RELEASE — Protected main, migration, stable promotion
  # ================================================================
  release:
    name: "🚀 Build, migrate, and release"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, sql-tests, audit-production, docker-build, codeql]
    environment: production
    permissions:
      contents: read
      security-events: write # upload the Trivy SARIF to code scanning
    runs-on: ubuntu-latest
    concurrency:
      group: shiftsentry-production
      cancel-in-progress: false
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/shiftsentry
      # Trivy v0.76.1, pinned by digest (identical on Docker Hub, GHCR, ECR Public).
      TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
      # REPORT-ONLY while the current findings are open: "0" logs and uploads
      # fixable CRITICAL/HIGH findings but still pushes and releases.
      # To BLOCK the push (and the migrations after it) on any fixable
      # CRITICAL/HIGH finding, change this to "1".
      TRIVY_EXIT_CODE: "0"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: "📥 Check out approved commit"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🔐 Validate release configuration"
        run: |
          test -n "$IMAGE_NAME"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$SUPABASE_DB_URL"
      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - name: "🔐 Log in to Docker Hub"
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # ---- Image vulnerability scan (Trivy) ------------------------------
      # Build the candidate into the local Docker store first, scan it, and
      # only then build again with push: true. The second build is a full
      # cache hit on the same builder, so it produces the same layers and
      # adds the provenance and SBOM attestations, which a load: true export
      # cannot carry. Nothing reaches Docker Hub until the gate step passes,
      # and migrations run after the push, so a blocked scan blocks them too.
      #
      # Trivy runs from its image pinned by digest (v0.76.1). Never use
      # aquasecurity/trivy-action or setup-trivy: their tags were hijacked in
      # the March 2026 supply-chain attack. The Docker socket is not mounted;
      # Trivy reads a `docker save` tarball. Its work dir is runner.temp, not
      # the checkout, so the tarball can never land in the build context.
      - name: "🐳 Build candidate locally for scanning"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          provenance: false
          sbom: false
      - name: "🛡️ Export candidate for Trivy"
        id: trivy-prep
        run: |
          TRIVY_WORKDIR="$RUNNER_TEMP/trivy"
          echo "TRIVY_WORKDIR=$TRIVY_WORKDIR" >> "$GITHUB_ENV"
          mkdir -p "$TRIVY_WORKDIR/cache"
          docker save "$IMAGE_NAME:sha-${GITHUB_SHA}" -o "$TRIVY_WORKDIR/image.tar"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # One key per UTC day: the first run of the day downloads a fresh DB
      # and saves it; later runs restore it. Trivy still refreshes a restored
      # DB itself if its metadata says it is stale.
      - name: "🛡️ Restore Trivy vulnerability DB"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TRIVY_WORKDIR }}/cache/db
          key: trivy-db-${{ steps.trivy-prep.outputs.date }}
          restore-keys: trivy-db-
      # Always exit 0 here so the SARIF is produced and uploaded even when
      # the gate below fails; the gate is the table run.
      - name: "🛡️ Scan candidate (SARIF)"
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$TRIVY_WORKDIR:/w" "$TRIVY_IMAGE"
          image --scanners vuln --input /w/image.tar
          --skip-version-check --disable-telemetry
          --cache-dir /w/cache
          --severity CRITICAL,HIGH --ignore-unfixed
          --exit-code 0 --format sarif --output /w/trivy.sarif
      - name: "🛡️ Upload Trivy results to code scanning"
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ env.TRIVY_WORKDIR }}/trivy.sarif
          category: trivy-release-candidate
      - name: "🛡️ Vulnerability gate (table)"
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$TRIVY_WORKDIR:/w" "$TRIVY_IMAGE"
          image --scanners vuln --input /w/image.tar
          --skip-version-check --disable-telemetry
          --cache-dir /w/cache --skip-db-update
          --severity CRITICAL,HIGH --ignore-unfixed
          --exit-code "$TRIVY_EXIT_CODE" --format table
      - name: "🐳 Push immutable candidate"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: "🗃️ Set up Supabase CLI"
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.84.2
      - name: "🗃️ Preflight migration history"
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: "🗃️ Apply verified pending migrations"
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - name: "🏷️ Promote tested candidate to stable"
        run: docker buildx imagetools create --tag "$IMAGE_NAME:stable" "$IMAGE_NAME:sha-${GITHUB_SHA}"
      # GitHub-hosted runner health requests receive HTTP 403 at the public edge.
      # After this job succeeds, verify /api/health from an allowed external
      # network until it reports status ok and the exact released GITHUB_SHA.
