# ============================================================
# 🚀 ShiftSaaS — Production CI/CD Pipeline
# ============================================================
# GATES:
#   1. Secrets  → Gitleaks scans the full Git history
#   2. Quality  → Prisma, tests, types, lint, production build
#   3. Audit    → Blocks new or compatibly-fixable high findings
#   4. Image    → Docker build verification
#   5. CodeQL   → JavaScript and TypeScript security analysis
#   6. Release  → Approved image, migration, immutable promotion
# ============================================================

name: "🚀 ShiftSaaS CI/CD Pipeline"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ================================================================
  # JOB 1: SECRET SCANNING — Full Git history with Gitleaks
  # ================================================================
  gitleaks:
    name: "🔐 Secret scanning"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check out repository history"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "🔐 Scan for leaked secrets"
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ================================================================
  # JOB 2: APPLICATION QUALITY — Build the actual production app
  # ================================================================
  quality:
    name: "✅ Application quality"
    needs: gitleaks
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: "📥 Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "📦 Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: 24
          cache: npm
      - name: "📦 Install dependencies"
        run: npm ci
      - name: "🗃️ Generate Prisma client"
        run: npm run db:generate
      - name: "🗃️ Validate Prisma schema"
        run: npx prisma validate
      - name: "🧪 Run earnings tests"
        run: npm run test:earnings
      - name: "🔎 Type-check"
        run: npx tsc --noEmit
      - name: "🔍 Lint"
        run: npm run lint
      - name: "🏗️ Build production app"
        run: npm run build

  # ================================================================
  # JOB 3: DEPENDENCY AUDIT — Allow only the tracked Prisma baseline
  # ================================================================
  audit-production:
    name: "📦 Production dependency audit"
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "📦 Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: 24
          cache: npm
      - name: "📦 Install dependencies"
        run: npm ci
      - name: "🔍 Audit production dependencies"
        run: npm run audit:production

  # ================================================================
  # JOB 4: IMAGE CHECK — Prove the production Dockerfile builds
  # ================================================================
  docker-build:
    name: "🐳 Docker build verification"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🐳 Build image with non-secret placeholders"
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
          --tag shiftsentry:ci .

  # ================================================================
  # JOB 5: DEPENDENCY REVIEW — Pull-request dependency changes
  # ================================================================
  dependency-review:
    name: "📋 Dependency review"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: "📋 Review dependency changes"
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # ================================================================
  # JOB 6: CODEQL — Security analysis for JavaScript and TypeScript
  # ================================================================
  codeql:
    name: "🛡️ CodeQL"
    needs: gitleaks
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🛡️ Initialize CodeQL"
        uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: "🛡️ Analyze code"
        uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4

  # ================================================================
  # JOB 7: RELEASE — Protected approval, migration, stable promotion
  # ================================================================
  release:
    name: "🚀 Build, migrate, and release"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, audit-production, docker-build, codeql]
    environment: production
    permissions:
      contents: read
    runs-on: ubuntu-latest
    concurrency:
      group: shiftsentry-production
      cancel-in-progress: false
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/shiftsentry
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: "📥 Check out approved commit"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🔐 Validate release configuration"
        run: |
          test -n "$IMAGE_NAME"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$SUPABASE_DB_URL"
      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
      - name: "🔐 Log in to Docker Hub"
        uses: docker/login-action@af63523ba5f55733d817da0fdb813e660152c72c # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: "🐳 Build and push immutable candidate"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: "🗃️ Set up Supabase CLI"
        uses: supabase/setup-cli@aa3515eac405eac768fa4a72147c22d88a283c7b # v2
        with:
          version: 2.84.2
      - name: "🗃️ Preflight migration history"
        run: |
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: "🗃️ Apply verified pending migrations"
        run: supabase db push --db-url "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL"
      - name: "🏷️ Promote tested candidate to stable"
        run: docker buildx imagetools create --tag "$IMAGE_NAME:stable" "$IMAGE_NAME:sha-${GITHUB_SHA}"
