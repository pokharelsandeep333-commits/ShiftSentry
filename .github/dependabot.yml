# ============================================================
# 🔄 Dependabot — maintenance pull requests only
# ============================================================
# Every week it checks the application packages, Docker base
# images, and pinned GitHub Actions. CI evaluates its PRs; this
# file never deploys code or changes the Supabase database.
# ============================================================

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The Prisma CLI and client must stay on one version; bumped apart,
      # `prisma generate` and the runtime disagree.
      prisma:
        patterns: ["prisma", "@prisma/*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL's init and analyze steps must run the same version; separate
      # PRs each fail with "Loaded a configuration file for version X, but
      # running version Y".
      codeql:
        patterns: ["github/codeql-action*"]
